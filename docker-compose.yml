services:
  backend:
    build: ./backend
    volumes:
      - caption-data:/app/data
    environment:
      - FRONTEND_URL=https://tools.complexelite.com
      - MAX_FILE_SIZE_MB=500
      - MAX_CONCURRENT_JOBS=2
    networks:
      captions-private: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    networks:
      captions-private: {}
      dokploy-network:
        aliases:
          - caption-frontend
    environment:
      - BACKEND_URL=http://backend:5000
      - DATABASE_URL=file:/app/data/captions.db
    volumes:
      - sqlite-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caption-data:
  sqlite-data:

networks:
  captions-private:
    # Transcription downloads its model from Hugging Face on first use.
    # Services remain unpublished, but need outbound internet access.
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
